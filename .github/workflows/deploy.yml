# Push to main = release: test, build, and publish dist/ to Cloudflare Pages.
# Settings (repository → Settings → Secrets and variables → Actions):
#   secret   CLOUDFLARE_API_TOKEN    a Cloudflare API token with the "Cloudflare Pages: Edit" permission
#   variable CLOUDFLARE_ACCOUNT_ID   your Cloudflare account ID
#   variable CLOUDFLARE_PROJECT      the Pages project to publish to
#   variable HOOKEDIN_DEVELOPER      the address that earns this game's commission
#   variable HOOKEDIN_ORACLE         (player-versus-player games) the public URL of the game's referee
# Without the token or the project the workflow still tests and builds; it just does not publish.
name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          HOOKEDIN_DEVELOPER: ${{ vars.HOOKEDIN_DEVELOPER }}
          HOOKEDIN_ORACLE: ${{ vars.HOOKEDIN_ORACLE }}
      - name: Publish to Cloudflare Pages
        if: env.CLOUDFLARE_API_TOKEN != '' && vars.CLOUDFLARE_PROJECT != ''
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PROJECT }} --branch=main
