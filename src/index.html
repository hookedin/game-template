<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HookedIn bridge probe</title>
    <link rel="icon" type="image/svg+xml" href="./brand/hookedin-mark.svg" />
    <link rel="stylesheet" href="./shared.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <section class="probe-grid" aria-label="Bridge requests">
        <div class="field">
          <label for="probe-stake">Stake · METH</label>
          <div class="input-wrap"><input id="probe-stake" inputmode="numeric" value="1" /></div>
        </div>
        <div class="field">
          <label for="probe-id">Operation ID</label>
          <div class="input-wrap"><input id="probe-id" value="" placeholder="new per request" /></div>
        </div>
        <button class="secondary" data-preset="casinoBet" type="button">game.casinoBet · 50% to double</button>
        <button class="secondary" data-preset="developerBet" type="button">game.developerBet</button>
        <button class="secondary" data-preset="payment" type="button">game.payment · stake</button>
        <button class="secondary" data-preset="receipt" type="button">game.receipt · last ID</button>
        <button class="secondary" data-preset="hello" type="button">wallet.hello</button>
        <button class="secondary" data-preset="info" type="button">wallet.info</button>
        <button class="secondary" data-preset="round" type="button">wallet.round</button>
        <button class="secondary" data-preset="allowance" type="button">game.allowance · probe</button>
        <button class="secondary" data-preset="requestAllowance" type="button">
          game.requestAllowance · stake, developer bets
        </button>
        <button class="secondary" data-preset="end" type="button">game.end · probe</button>
      </section>
      <label class="field-label" for="probe-request">Raw request (edit, then send)</label>
      <textarea id="probe-request" rows="6" spellcheck="false"></textarea>
      <div class="probe-actions">
        <button class="primary" id="probe-send" type="button">Send ↗</button>
        <button class="secondary" id="probe-clear" type="button">Clear output</button>
      </div>
      <pre id="probe-output" class="probe-output" aria-live="polite">Replies appear here, newest first.</pre>
    </main>
    <script type="module" src="./game.js" crossorigin="anonymous"></script>
  </body>
</html>
